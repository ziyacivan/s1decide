# Stage 1 of the smoke run: 27B QLoRA on the 3090. Attempt 2 (approved 2026-09-23) after the
# first failed on pre-quantized-checkpoint handling, not memory. Attempt 3 (after teacher run 2):
# fixed Unsloth path, full ADR 0002 adapter, one pass over 200 rows (200 steps at batch 1).
#
# seq 1024, batch 1, rank 8 — the smallest configuration that still exercises the real model.
# If this OOMs it is not retried with smaller numbers: the answer is that S1 proper needs the
# h100_linux config, and sft_h100.yaml is ready for it.
hardware: rtx3090_windows
model: unsloth/Qwen3.8-27B-unsloth-bnb-4bit
run_id: smoke-27b-attempt3
# One pass: steps = ceil(limit / batch_size), every selected row seen exactly once, so the
# coverage table describes the rows actually trained on by construction.
max_steps: null
rank: 8
lora_alpha: 16
learning_rate: 1.0e-4
batch_size: 1
grad_accum: 1
max_seq_len: 1024
limit: 200
lambda_distance: 0.3
load_in_4bit: true
