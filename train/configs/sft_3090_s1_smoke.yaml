# The S1 config end to end at a 400-row budget: sampling, schedule, checkpoint and the full val
# eval slice at row 0 and row 400. Differs from sft_3090_s1.yaml only in run_id, budget and cadence.
hardware: rtx3090_windows
model: unsloth/Qwen3.8-27B-unsloth-bnb-4bit
run_id: s1-3090-smoke
load_in_4bit: true

# Adapter: ADR 0002 attention + MLP. Rank 8; rank 16 is deferred to v0.2 on an H100
# (results/memory-envelope-2026-09-23/envelope.json).
rank: 8
lora_alpha: 16

# Memory: batch 1 in memory, accumulated to an effective batch of 8.
batch_size: 1
grad_accum: 8
# The corpus's longest row is 843 tokens, so nothing is dropped at 2048 and the cap costs no
# memory at batch 1 (results/token-lengths-2026-09-23, the seq-2048 envelope point).
max_seq_len: 2048

# Optimisation: 2e-5 reversed the smoke adapter's Score regression that 1e-4 caused
# (results/score-ab-lr2e5-2026-09-23). ~3% linear warmup, then cosine to zero.
learning_rate: 2.0e-5
warmup_fraction: 0.03
lr_schedule: cosine
lambda_distance: 0.3

# Sampling: 30,000 rows with replacement under data/processed/sampling_weights.json,
# Score uniform by row (soft/hard at their natural share). 3,750 optimiser steps.
sampling: family_balanced
sample_budget: 400
max_steps: null
limit: null

# Every 5,000 rows, and at row 0: save the adapter, and evaluate the fixed val slice (every
# non-stage-1 row + 300 stage-1 questions case-control) per primitive — KL, accuracy, ECE, BSS
# and the predicted-vs-target marginal.
checkpoint_every_rows: 400
eval_every_rows: 400
eval_mode: case-control
eval_stage1_questions: 300
eval_negatives: 16
eval_batch_size: 8
